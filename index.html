<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container _container">
          <img
            src="img/header/Logo.svg"
            alt="Merkury logo"
            class="header__logo"
          />
          <nav class="header__menu menu">
            <ul class="menu__list">
              <li class="menu_item">
                <a href="" class="menu__link">Features</a>
              </li>
              <li class="menu_item">
                <a href="" class="menu__link">Pricing</a>
              </li>
              <li class="menu_item">
                <a href="" class="menu__link">Blog</a>
              </li>
              <li class="menu_item">
                <a href="" class="menu__link">Contact</a>
              </li>
            </ul>
          </nav>
          <button class="header__button button">Login</button>
        </div>
      </header>
      <main class="page">
        <div class="page__main-block main-block">
          <section class="main-block__container _container">
            <div class="main-block__body">
              <h1 class="main-block__title">Grow Your business with Merkury</h1>
              <div class="main-block__text">Your partner in crime!</div>
              <button class="main-block__button">Get started</button>
            </div>
          </section>
          <div class="main-block__background _ibg">
            <img
              src="img/main/background/Grid.svg"
              alt="Background grid"
              class="background__grid"
            />
            <img
              src="img/main/background/Graph.svg"
              alt="Background grid"
              class="background__graph"
            />
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
